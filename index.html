<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>VIN Video Summary</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;--surface:#ffffff;--surface-2:#fbfaf6;--ink:#0b0b0c;--ink-2:#404045;
    --muted:#76767c;--line:#e8e6df;--line-2:#d6d3c8;--accent:#1f3f72;--green:#1f7a52;--amber:#9a6700;
    --shadow:rgba(0,0,0,0.05);--shadow-lg:rgba(0,0,0,0.18);
    --c1:#3b5bdb;--c2:#c92a4a;--c3:#d9820b;--c4:#2b8a57;--c5:#7048c6;--c6:#0c8599;--c7:#c2255c;--c8:#5c940d;
  }
  [data-theme="dark"]{
    --bg:#111113;--surface:#1c1c1f;--surface-2:#222226;--ink:#f0efe9;--ink-2:#b0b0b8;
    --muted:#8a8a92;--line:#2a2a2f;--line-2:#34343a;--accent:#6b9eff;--green:#4ade80;--amber:#f5c265;
    --shadow:rgba(0,0,0,0.3);--shadow-lg:rgba(0,0,0,0.6);
    --c1:#748ffc;--c2:#f06582;--c3:#fcb54a;--c4:#51cf8a;--c5:#b197fc;--c6:#3bc9db;--c7:#f783ac;--c8:#a9e34b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}

  /* HEADER */
  #sticky-top{position:sticky;top:0;z-index:100;}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
  header .actions{justify-self:end;}
  .view-seg{justify-self:center;}
  .view-seg button{padding:6px 18px;font-size:13px;}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{margin:0;font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:22px;letter-spacing:-.025em;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .actions{display:flex;align-items:center;gap:10px;}
  .sync-info{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
  .sync-info.stale{color:var(--amber,#b27a00);}
  .update-link{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;}
  .update-link:hover{text-decoration:underline;}
  .btn-icon{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);padding:7px 12px;border-radius:6px;font:500 13px 'Inter';cursor:pointer;}
  .btn-icon:hover{background:var(--bg);color:var(--ink);}
  .btn-sync{background:var(--ink);color:var(--surface);border:none;padding:8px 16px;border-radius:6px;font:500 13px 'Inter';cursor:pointer;}
  .btn-sync:hover{opacity:.82;}.btn-sync[disabled]{opacity:.45;cursor:wait;}

  /* FILTERS */
  .filters{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:0 2px 10px var(--shadow);}
  .f-group{display:flex;flex-direction:column;gap:4px;position:relative;}
  .f-label{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .trigger{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:400 13px 'Inter';color:var(--ink);cursor:pointer;min-width:136px;max-width:220px;user-select:none;white-space:nowrap;}
  .trigger:hover,.trigger.open{border-color:var(--accent);}
  .trigger .t-text{flex:1;overflow:hidden;text-overflow:ellipsis;}
  .trigger.active .t-text{color:var(--accent);font-weight:500;}
  .trigger .chev{opacity:.4;flex-shrink:0;transition:transform .2s;}
  .trigger.open .chev{transform:rotate(180deg);}
  .panel{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px var(--shadow-lg);}
  .panel.open{display:block;}
  .ms-panel{width:300px;padding:8px;}
  .ms-search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:400 13px 'Inter';color:var(--ink);outline:none;}
  .ms-search:focus{border-color:var(--accent);}
  .ms-bulk{display:flex;justify-content:space-between;padding:6px 2px;}
  .ms-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);align-self:center;}
  .ms-bulk button{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:2px 4px;}
  .ms-list{max-height:280px;overflow-y:auto;}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:5px;cursor:pointer;font-size:13px;}
  .ms-opt:hover{background:var(--bg);}
  .ms-opt input{accent-color:var(--accent);margin:0;flex-shrink:0;}
  .ms-opt .o-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms-opt .o-sub{color:var(--muted);font-size:11px;}
  .ms-opt .o-n{color:var(--muted);font-size:11px;}
  .ms-empty{padding:10px 6px;color:var(--muted);font-size:12px;}
  .btn-reset{background:transparent;border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink-2);height:34px;}
  .btn-reset:hover{background:var(--bg);}

  /* DATE PICKER */
  .date-panel{display:none;min-width:520px;overflow:hidden;}
  .date-panel.open{display:flex;}
  .dp-presets{width:160px;flex-shrink:0;border-right:1px solid var(--line);padding:8px 0;background:var(--bg);}
  .dp-preset{display:block;width:100%;text-align:left;padding:7px 14px;background:none;border:none;border-left:2px solid transparent;font:400 13px 'Inter';color:var(--ink-2);cursor:pointer;}
  .dp-preset:hover{background:var(--surface);color:var(--ink);}
  .dp-preset.sel{color:var(--accent);font-weight:500;border-left-color:var(--accent);background:var(--surface);}
  .dp-body{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .dp-row{display:flex;gap:10px;}
  .dp-row label{display:flex;flex-direction:column;gap:4px;flex:1;}
  .dp-row input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:400 13px 'Inter';color:var(--ink);color-scheme:light dark;}
  .dp-preview{padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .dp-apply{align-self:flex-end;background:var(--ink);color:var(--surface);border:none;padding:7px 16px;border-radius:6px;font:500 13px 'Inter';cursor:pointer;}

  /* MAIN */
  main{padding:24px 28px 48px;}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px var(--shadow);}
  .kpi-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .kpi-value{font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:38px;letter-spacing:-.02em;margin-top:8px;line-height:1.1;font-variant-numeric:tabular-nums;}
  .kpi-sub{font-size:12px;color:var(--muted);margin-top:6px;}
  .kpi.accent .kpi-value{color:var(--green);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:18px;box-shadow:0 1px 3px var(--shadow);overflow:hidden;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .card-head h2{margin:0;font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:16px;}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{background:none;border:none;padding:4px 12px;border-radius:999px;font-size:12px;color:var(--ink-2);cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px var(--shadow);}
  .tbl-wrap{overflow-x:auto;max-height:560px;overflow-y:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;}
  th.num,td.num{text-align:right;}
  th .arr{opacity:.6;margin-left:4px;}
  td{padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td.sub{color:var(--muted);}
  tbody tr:hover td{background:var(--bg);}
  tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0;}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--green);vertical-align:middle;margin-right:8px;opacity:.75;}

  /* SOURCE CARDS */
  .src-row{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:10px;margin-top:12px;}
  .src-card{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--muted));border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:0 1px 3px var(--shadow);transition:border-color .15s,transform .15s;}
  .src-card:hover{transform:translateY(-1px);border-color:var(--sc,var(--accent));}
  .src-card.sel{border-color:var(--sc,var(--accent));box-shadow:0 0 0 1px var(--sc,var(--accent)) inset,0 1px 3px var(--shadow);}
  .src-card.dim{opacity:.55;}
  .src-card .kpi-label{font-size:10px;text-transform:none;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .src-val{font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:22px;margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .src-card.sel .src-val{color:var(--sc,var(--accent));}
  .src-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
  @media(max-width:900px){.src-row{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}}

  /* REPORT */
  /* compact so all five rows fit on one laptop screen */
  .rep-row{margin-top:12px;}
  .rep-row:first-child{margin-top:-6px;}
  .rep-head{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;}
  .rep-head h2{margin:0;font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:15px;}
  .rep-head span{font-size:11px;color:var(--muted);}
  .rep-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .rep-cards .kpi{position:relative;padding:10px 16px 12px;border-radius:10px;}
  .rep-cards .kpi-label{font-size:10px;}
  .rep-cards .kpi-value{font-size:26px;margin-top:4px;}
  .rep-cards .kpi-sub{font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rep-cards .kpi-bar{margin-top:8px;height:3px;}
  .rep-cards .kpi-hint{position:absolute;top:10px;right:14px;margin:0;}
  .kpi.qc .kpi-value{color:var(--accent);}
  .kpi-bar{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden;}
  .kpi-bar i{display:block;height:100%;background:var(--kb,var(--ink-2));border-radius:2px;}

  /* DRILL-DOWN */
  .kpi.click{cursor:pointer;transition:border-color .15s,transform .15s;}
  .kpi.click:hover{border-color:var(--accent);transform:translateY(-1px);}
  .kpi-hint{font-size:11px;color:var(--accent);margin-top:8px;opacity:0;transition:opacity .15s;}
  .kpi.click:hover .kpi-hint{opacity:1;}
  .lnk{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;}
  .lnk:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px var(--shadow-lg);width:min(1200px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:18px;}
  .modal-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .modal-tools{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;}
  .modal-tools .ms-search{flex:1;min-width:200px;}
  .modal .tbl-wrap{max-height:none;flex:1;}
  .modal-foot{padding:8px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--bg);border:1px solid var(--line);}
  .pill.yes{color:var(--green);border-color:var(--green);}
  .chips{display:flex;flex-wrap:wrap;gap:4px;white-space:normal;min-width:160px;}
  .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;}
  .stage-sub{display:block;font-size:11px;color:var(--muted);}

  .state{padding:60px 20px;text-align:center;color:var(--muted);}
  .state.err{color:#b3261e;}

  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:700px){.rep-cards{grid-template-columns:minmax(0,1fr);}}
  @media(max-width:760px){header{grid-template-columns:1fr auto;}.view-seg{grid-column:1 / -1;grid-row:2;}}
  @media(max-width:600px){header .tag,.sync-info,.update-link{display:none;}header h1{font-size:18px;white-space:nowrap;}}
  @media(max-width:600px){
    #sticky-top{position:static;}
    header,.filters,main{padding-left:16px;padding-right:16px;}
    .kpi-value{font-size:30px;}
    .f-group{flex:1 1 calc(50% - 10px);}
    .trigger{min-width:0;max-width:none;width:100%;}
    .panel{position:fixed;left:16px;right:16px;top:auto;width:auto;}
    .ms-panel{width:auto;}
    .date-panel{min-width:0;flex-direction:column;}
    .dp-presets{width:100%;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;}
    .dp-preset{width:auto;border-left:none;}
  }
</style>
</head>
<body>
<div id="sticky-top">
  <header>
    <div class="brand">
      <h1>VIN Video Summary</h1>
      <span class="tag">Metabase model 13134</span>
    </div>
    <div class="seg view-seg" id="viewSeg" role="tablist" aria-label="Dashboard view">
      <button data-view="summary" role="tab">Summary</button>
      <button data-view="report" role="tab">Report</button>
    </div>
    <div class="actions">
      <span class="sync-info" id="syncInfo">Loading…</span>
      <a class="update-link" id="updateLink" href="https://github.com/nitin0253/vin-data-summary_video-dashboard/actions/workflows/deploy.yml" target="_blank" rel="noopener" title="Data is pulled from Metabase by a GitHub Action. Open it and press &quot;Run workflow&quot; to update now (about 2 minutes), then press Refresh.">Update now ↗</a>
      <button class="btn-icon" id="themeBtn" title="Toggle theme">◐</button>
      <button class="btn-sync" id="syncBtn" title="Reload the latest published data. New data is published by the GitHub Action (see Update now).">Refresh</button>
    </div>
  </header>
  <div class="filters" id="filters">
    <div class="f-group">
      <span class="f-label">Date (created on)</span>
      <div class="trigger" id="dtTrigger"><span class="t-text" id="dtLabel">This month</span><span class="chev">▾</span></div>
      <div class="panel date-panel" id="dtPanel">
        <div class="dp-presets" id="dpPresets"></div>
        <div class="dp-body">
          <div class="dp-row">
            <label><span class="f-label">From</span><input type="date" id="dpFrom"></label>
            <label><span class="f-label">To</span><input type="date" id="dpTo"></label>
          </div>
          <div class="dp-preview" id="dpPreview"></div>
          <button class="dp-apply" id="dpApply">Apply custom range</button>
        </div>
      </div>
    </div>
    <!-- multi-select filters are injected here -->
    <button class="btn-reset" id="resetBtn">Reset</button>
  </div>
</div>

<main>
  <div id="content">
    <div class="state">Loading data from Metabase…</div>
  </div>
</main>

<script>
// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
// D is the decoded data.json (see scripts/build-data.mjs → encode()):
// dictionaries + one entry per row in three typed arrays K (combo), DAY, VIN.
let D = null;
const F = { preset:'this_month', from:null, to:null, ent:null, team:null, crm:null, vqc:null, src:null, reg:null, seg:null };
let groupBy = 'ent';
let VIEW = location.hash === '#report' ? 'report' : 'summary';
const sort = { col:'vins', dir:'desc' };

const FILTERS = [
  { key:'ent',  label:'Enterprise',     all:'All enterprises' },
  { key:'team', label:'Team',           all:'All teams' },
  { key:'crm',  label:'CRM status',     all:'All statuses' },
  { key:'vqc',  label:'Video QC',       all:'All' },
  { key:'src',  label:'Source',         all:'All sources' },
  { key:'reg',  label:'Region',         all:'All regions' },
  { key:'seg',  label:'Customer segment', all:'All segments' },
];

// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const vqcLabel = v => v === '1' ? 'QC on (1)' : v === '0' ? 'QC off (0)' : (v || '(blank)');
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDay = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });

// ─────────────────────────────────────────────────────────────
// DATE PRESETS (weeks start Monday)
// ─────────────────────────────────────────────────────────────
const PRESETS = [
  ['all','All time'],['today','Today'],['yesterday','Yesterday'],
  ['this_week','This week'],['last_week','Last week'],
  ['this_month','This month'],['last_month','Last month'],
  ['last_30','Last 30 days'],['custom','Custom range'],
];
const PLABEL = Object.fromEntries(PRESETS);

function presetRange(p){
  const now = new Date(), tod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const ago = n => { const d = new Date(tod); d.setDate(tod.getDate() - n); return d; };
  const monday = () => { const day = tod.getDay(), d = new Date(tod); d.setDate(tod.getDate() + (day === 0 ? -6 : 1 - day)); return d; };
  if (p === 'today')      return { from:tod, to:tod };
  if (p === 'yesterday')  return { from:ago(1), to:ago(1) };
  if (p === 'this_week')  return { from:monday(), to:tod };
  if (p === 'last_week'){ const m = monday(), to = new Date(m); to.setDate(m.getDate() - 1); const fr = new Date(to); fr.setDate(to.getDate() - 6); return { from:fr, to }; }
  if (p === 'this_month') return { from:new Date(now.getFullYear(), now.getMonth(), 1), to:tod };
  if (p === 'last_month') return { from:new Date(now.getFullYear(), now.getMonth() - 1, 1), to:new Date(now.getFullYear(), now.getMonth(), 0) };
  if (p === 'last_30')    return { from:ago(29), to:tod };
  return { from:null, to:null };
}

function setPreset(p){
  F.preset = p;
  if (p !== 'custom'){ const r = presetRange(p); F.from = r.from; F.to = r.to; }
  $('dtLabel').textContent = rangeLabel();
  $('dtTrigger').classList.toggle('active', p !== 'all');
}
function rangeLabel(){
  if (F.preset !== 'custom') return PLABEL[F.preset];
  if (!F.from && !F.to) return 'All time';
  return `${F.from ? fmtDay(F.from) : '…'} – ${F.to ? fmtDay(F.to) : '…'}`;
}

// Rows carry created_on as days since 1970-01-01 (-1 = no date).
const dayNum = d => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
function dayBounds(){
  return { any: !F.from && !F.to, lo: F.from ? dayNum(F.from) : -Infinity, hi: F.to ? dayNum(F.to) : Infinity };
}

// ─────────────────────────────────────────────────────────────
// FILTERING
// ─────────────────────────────────────────────────────────────
// Every combo (team × crm × source × video QC × processed) is checked once
// against the non-date filters; rows then only need a lookup + a date check.
function decode(j){
  const n = j.k.length, K = Int32Array.from(j.k), DAY = Int32Array.from(j.d), VIN = new Int32Array(n);
  let v = 0;
  for (let i = 0; i < n; i++){ v += j.v[i]; VIN[i] = v; }
  const entIdx = new Map(), ents = [];
  for (const t of j.teams) if (!entIdx.has(t[0])){ entIdx.set(t[0], ents.length); ents.push({ id:t[0], name:t[1] || t[0] || '(blank)' }); }
  const cv = { ent:[], team:[], crm:[], src:[], vqc:[], reg:[], seg:[] }, cTeam = [], cEnt = [], cVp = [], cSrc = [], cReg = [], cSeg = [], cQc = [];
  const regs = j.reg || [''], segs = j.seg || [''];
  for (const [t, c, s, q, vp, rg = 0, sg = 0] of j.combos){
    const team = j.teams[t];
    cv.ent.push(team[0]); cv.team.push(team[2]); cv.crm.push(j.crm[c]); cv.src.push(j.src[s]); cv.vqc.push(j.vqc[q]); cv.reg.push(regs[rg] ?? ''); cv.seg.push(segs[sg] ?? '');
    cTeam.push(t); cEnt.push(entIdx.get(team[0])); cVp.push(vp); cSrc.push(s); cReg.push(rg); cSeg.push(sg); cQc.push(j.vqc[q] === '1' ? 1 : 0);
  }
  // U = one id per (VIN, rooftop/team). A VIN uploaded under two rooftops counts
  // twice; repeated rows for the same VIN in the same rooftop count once. Rows
  // arrive sorted by VIN then team, so the id changes wherever that pair changes.
  const U = new Int32Array(n);
  for (let i = 0, u = -1, pv = -1, pt = -1; i < n; i++){
    const t = cTeam[K[i]];
    if (VIN[i] !== pv || t !== pt){ u++; pv = VIN[i]; pt = t; }
    U[i] = u;
  }
  return { n, K, DAY, VIN, U, teams:j.teams, teamMeta:j.teamMeta || [], ents, srcs:j.src, regs, segs, cv, cTeam, cEnt, cVp, cSrc, cReg, cSeg, cQc, nc:j.combos.length, lastSynced:j.lastSynced };
}

function comboOk(skip){
  const ok = new Uint8Array(D.nc);
  for (let c = 0; c < D.nc; c++){
    let pass = 1;
    for (const { key } of FILTERS){
      if (key !== skip && F[key] && !F[key].has(D.cv[key][c])){ pass = 0; break; }
    }
    ok[c] = pass;
  }
  return ok;
}

// Counts are VINs per rooftop (same as the KPI cards), not rows. Rows are sorted by
// VIN then team, so a unit (U) is new for a value when it differs from the last one that value saw.
function optionsFor(key){
  const ok = comboOk(key), { any, lo, hi } = dayBounds();
  const { K, DAY, U, n } = D, cv = D.cv[key];
  const vidx = new Map(), vOf = new Int32Array(D.nc);
  for (let c = 0; c < D.nc; c++){ let x = vidx.get(cv[c]); if (x === undefined){ x = vidx.size; vidx.set(cv[c], x); } vOf[c] = x; }
  const cnt = new Int32Array(vidx.size), last = new Int32Array(vidx.size).fill(-1), sub = new Array(vidx.size);
  for (let i = 0; i < n; i++){
    const c = K[i];
    if (!ok[c]) continue;
    if (!any){ const d = DAY[i]; if (d < 0 || d < lo || d > hi) continue; }
    const x = vOf[c], v = U[i];
    if (sub[x] === undefined) sub[x] = key === 'team' ? D.ents[D.cEnt[c]].name : '';
    if (v !== last[x]){ cnt[x]++; last[x] = v; }
  }
  const m = new Map();
  for (const [v, x] of vidx) if (cnt[x]) m.set(v, { v, n:cnt[x], name: labelFor(key, v), sub: sub[x] });
  // Keep selected values visible even if they currently match nothing.
  if (F[key]) for (const v of F[key]) if (!m.has(v)) m.set(v, { v, n:0, name: labelFor(key, v), sub:'' });
  return [...m.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
function labelFor(key, v){
  if (key === 'ent') return D.ents.find(e => e.id === v)?.name || v || '(blank)';
  if (key === 'team'){ const t = D.teams.find(t => t[2] === v); return (t && t[3]) || v || '(blank)'; }
  if (key === 'vqc') return vqcLabel(v);
  return v || '(blank)';
}

function syncTriggers(){

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
// Card rows (Source, Region): unique VINs per value under every filter except
// that dimension, so each card keeps its number while one value is selected.
// Rows are sorted by VIN (see render), so "new VIN" = differs from the last one seen.
const CARD_DIMS = [
  { key:'src', all:'All sources', aria:'Unique VINs by source', values: () => D.srcs, of: c => D.cSrc[c] },
  { key:'reg', all:'All regions', aria:'Unique VINs by region', values: () => D.regs, of: c => D.cReg[c] },
  { key:'seg', all:'All segments', aria:'Unique VINs by customer segment', values: () => D.segs, of: c => D.cSeg[c] },
];
function dimStats(dim){
  const ok = comboOk(dim.key), { any, lo, hi } = dayBounds();
  const { K, DAY, U, n } = D, vals = dim.values(), ns = vals.length;
  const idxOf = Int32Array.from({ length:D.nc }, (_, c) => dim.of(c));
  const cnt = new Int32Array(ns), last = new Int32Array(ns).fill(-1);
  let total = 0, lastAll = -1;
  for (let i = 0; i < n; i++){
    const c = K[i];
    if (!ok[c]) continue;
    if (!any){ const d = DAY[i]; if (d < 0 || d < lo || d > hi) continue; }
    const v = U[i], s = idxOf[c];
    if (v !== lastAll){ total++; lastAll = v; }
    if (v !== last[s]){ cnt[s]++; last[s] = v; }
  }
  const list = vals.map((v, i) => ({ v, n:cnt[i] })).filter(x => x.n).sort((a, b) => b.n - a.n || a.v.localeCompare(b.v));
  return { total, list };
}

// Stable colour per value (by overall volume), so a card keeps its colour as filters change.
const DIM_COLOR = {};
function dimColor(key, v){
  if (!DIM_COLOR[key]){
    const tot = new Map();
    for (let c = 0; c < D.nc; c++) tot.set(D.cv[key][c], 0);
    for (let i = 0; i < D.n; i++){ const v = D.cv[key][D.K[i]]; tot.set(v, tot.get(v) + 1); }
    DIM_COLOR[key] = new Map([...tot].sort((a, b) => b[1] - a[1]).map(([v], i) => [v, i < 8 ? `var(--c${i + 1})` : 'var(--muted)']));
  }
  return DIM_COLOR[key].get(v) || 'var(--muted)';
}

// Both rows share one column count so region cards line up with source cards.
function cardRowsHTML(){
  const stats = CARD_DIMS.map(dimStats);
  const cols = Math.max(...stats.map(ss => ss.list.length + 1));
  return CARD_DIMS.map((dim, i) => cardRowHTML(dim, stats[i], cols)).join('');
}
function cardRowHTML(dim, ss, cols){
  const sel = F[dim.key];
  return `<section class="src-row" data-dim="${dim.key}" aria-label="${dim.aria}" style="--cols:${cols}">
    <button class="src-card ${!sel ? 'sel' : ''}" data-v="" style="--sc:var(--accent)">
      <div class="kpi-label">${dim.all}</div><div class="src-val">${fmt(ss.total)}</div><div class="src-pct">100%</div>
    </button>
    ${ss.list.map(x => `<button class="src-card ${sel && sel.has(x.v) ? 'sel' : sel ? 'dim' : ''}" data-v="${esc(x.v)}" style="--sc:${dimColor(dim.key, x.v)}" title="Filter to ${esc(x.v || '(blank)')}">
      <div class="kpi-label">${esc(x.v || '(blank)')}</div><div class="src-val">${fmt(x.n)}</div><div class="src-pct">${ss.total ? (x.n / ss.total * 100).toFixed(2) : '0.00'}%</div>
    </button>`).join('')}
  </section>`;
}

function render(){
  if (!D) return;
  document.querySelectorAll('#viewSeg button').forEach(b => { const on = b.dataset.view === VIEW; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  document.querySelector('header h1').textContent = VIEW === 'report' ? 'VIN Video Report' : 'VIN Video Summary';
  if (VIEW === 'report') return renderReport();
  // One pass over rows. Counting unit is U = (VIN, rooftop); rows are sorted by it,
  // so a unit is new for a bucket whenever it differs from the last one that bucket saw.
  const ok = comboOk(null), { any, lo, hi } = dayBounds();
  const { K, DAY, U, n, cTeam, cEnt, cVp, cQc } = D;
  const byTeam = groupBy === 'team';
  const nG = byTeam ? D.teams.length : D.ents.length;
  const gVins = new Int32Array(nG), gVp = new Int32Array(nG), gLast = new Int32Array(nG).fill(-1), gLastVp = new Int32Array(nG).fill(-1);
  const comboHit = new Uint8Array(D.nc);
  let rowsN = 0, vinsN = 0, vpN = 0, qcN = 0, last = -1, lastVp = -1, lastQc = -1;
  for (let i = 0; i < n; i++){
    const c = K[i];
    if (!ok[c]) continue;
    if (!any){ const d = DAY[i]; if (d < 0 || d < lo || d > hi) continue; }
    rowsN++; comboHit[c] = 1;
    const v = U[i], g = byTeam ? cTeam[c] : cEnt[c];
    if (v !== last){ vinsN++; last = v; }
    if (v !== gLast[g]){ gVins[g]++; gLast[g] = v; }
    if (cQc[c] === 1 && v !== lastQc){ qcN++; lastQc = v; }
    if (cVp[c] === 1){
      if (v !== lastVp){ vpN++; lastVp = v; }
      if (v !== gLastVp[g]){ gVp[g]++; gLastVp[g] = v; }
    }
  }
  const ents = new Set(), teams = new Set(), gTeams = Array.from({ length:nG }, () => new Set()), gSegs = Array.from({ length:nG }, () => new Set());
  for (let c = 0; c < D.nc; c++){
    if (!comboHit[c]) continue;
    ents.add(cEnt[c]); teams.add(cTeam[c]);
    const g = byTeam ? cTeam[c] : cEnt[c];
    gTeams[g].add(cTeam[c]);
    if (D.cv.seg[c]) gSegs[g].add(D.cv.seg[c]);   // segment is per row: values seen in scope
  }
  const groups = [];
  for (let g = 0; g < nG; g++){
    if (!gTeams[g].size) continue;
    const t = byTeam ? D.teams[g] : null;
    // Stage / products: the team's own values, or for an enterprise every value across its teams in scope.
    const metas = [...gTeams[g]].map(ti => D.teamMeta[ti] || ['', '', []]);
    const stage = distinct(metas.map(m => m[0])).sort(), stageSub = distinct(metas.map(m => m[1])).sort();
    const prods = distinct(metas.flatMap(m => m[2])).sort((a, b) => prodLabel(a).localeCompare(prodLabel(b)));
    groups.push({ stage, stageSub, prods, segs:[...gSegs[g]].sort(), g, id: byTeam ? t[2] : D.ents[g].id, name: byTeam ? (t[3] || t[2] || '(blank)') : D.ents[g].name, sub: byTeam ? (t[1] || t[0]) : '', teams:gTeams[g], vins:gVins[g], vp:gVp[g] });
  }
  const vins = { size:vinsN }, vp = { size:vpN }, rows = { length:rowsN };

  const list = groups.map(g => ({ segTxt:g.segs.join(' / '), ent:g.sub, stageTxt:g.stage.join(' / '), subTxt:g.stageSub.join(' / '), prods:g.prods, prodTxt:g.prods.map(prodLabel).join(', '), g:g.g, id:g.id, name:g.name, sub:g.sub, teams:g.teams.size, vins:g.vins, vp:g.vp, pct: g.vins ? g.vp / g.vins : 0 }));
  const dir = sort.dir === 'asc' ? 1 : -1;
  const TEXT_SORT = { name:'name', ent:'ent', stage:'stageTxt', seg:'segTxt', products:'prodTxt' };
  list.sort((a, b) => TEXT_SORT[sort.col] ? dir * (a[TEXT_SORT[sort.col]] || '').localeCompare(b[TEXT_SORT[sort.col]] || '') || b.vins - a.vins : dir * (a[sort.col] - b[sort.col]) || b.vins - a.vins);
  const maxV = Math.max(1, ...list.map(g => g.vins));
  const pctAll = vins.size ? (vp.size / vins.size * 100).toFixed(2) : '0.00';
  const arrow = c => sort.col === c ? `<span class="arr">${sort.dir === 'asc' ? '↑' : '↓'}</span>` : '';

  $('content').innerHTML = `
    <section class="kpis">
      <div class="kpi click" data-k="ent" role="button" tabindex="0"><div class="kpi-label">Unique enterprises</div><div class="kpi-value">${fmt(ents.size)}</div><div class="kpi-sub">${esc(rangeLabel())}</div><div class="kpi-hint">Breakdown by enterprise →</div></div>
      <div class="kpi click" data-k="team" role="button" tabindex="0"><div class="kpi-label">Unique teams</div><div class="kpi-value">${fmt(teams.size)}</div><div class="kpi-sub">across ${fmt(ents.size)} enterprise${ents.size === 1 ? '' : 's'}</div><div class="kpi-hint">Breakdown by team →</div></div>
      <div class="kpi click" data-k="vins" role="button" tabindex="0"><div class="kpi-label">Unique VINs</div><div class="kpi-value">${fmt(vins.size)}</div><div class="kpi-sub">sku_name per rooftop · ${fmt(rows.length)} rows</div><div class="kpi-hint">View VINs →</div></div>
      <div class="kpi click" data-k="qc" role="button" tabindex="0"><div class="kpi-label">QC On count</div><div class="kpi-value">${fmt(qcN)}</div><div class="kpi-sub">video_qualityCheck = 1 · ${vins.size ? (qcN / vins.size * 100).toFixed(2) : '0.00'}% of VINs</div><div class="kpi-hint">View QC-on VINs →</div></div>
      <div class="kpi accent click" data-k="vp" role="button" tabindex="0"><div class="kpi-label">Videos processed</div><div class="kpi-value">${fmt(vp.size)}</div><div class="kpi-sub">Video_Processed = 1 · ${pctAll}% of VINs</div><div class="kpi-hint">View processed VINs →</div></div>
    </section>

    ${cardRowsHTML()}

    <section class="card" id="breakdown">
      <div class="card-head">
        <h2>Breakdown by ${groupBy === 'ent' ? 'enterprise' : 'team'}</h2>
        <div class="seg" id="groupSeg">
          <button data-g="ent" class="${groupBy === 'ent' ? 'on' : ''}">Enterprise</button>
          <button data-g="team" class="${groupBy === 'team' ? 'on' : ''}">Team</button>
        </div>
      </div>
      ${list.length ? `
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th data-s="name">${groupBy === 'ent' ? 'Enterprise' : 'Team'}${arrow('name')}</th>
          ${groupBy === 'team' ? `<th data-s="ent">Enterprise${arrow('ent')}</th>` : ''}
          <th data-s="stage">Stage${arrow('stage')}</th>
          <th data-s="seg">Customer segment${arrow('seg')}</th>
          <th data-s="products">Products${arrow('products')}</th>
          ${groupBy === 'ent' ? `<th class="num" data-s="teams">Teams${arrow('teams')}</th>` : ''}
          <th class="num" data-s="vins">Unique VINs${arrow('vins')}</th>

        </tr></thead>
        <tbody>${list.map(g => `<tr data-g="${g.g}" data-id="${esc(g.id)}">
          <td><button class="lnk" data-a="filter" title="Filter the dashboard to this ${groupBy === 'ent' ? 'enterprise' : 'team'}">${esc(g.name)}</button></td>
          ${groupBy === 'team' ? `<td>${esc(g.ent || '—')}</td>` : ''}
          <td>${esc(g.stageTxt || '—')}${g.subTxt ? `<span class="stage-sub">${esc(g.subTxt)}</span>` : ''}</td>
          <td>${esc(g.segTxt || '—')}</td>

          ${groupBy === 'ent' ? `<td class="num mono"><button class="lnk" data-a="teams" title="Show this enterprise's teams">${fmt(g.teams)}</button></td>` : ''}
          <td class="num mono"><span class="bar" style="width:${Math.max(2, g.vins / maxV * 80)}px"></span><button class="lnk" data-a="vins" title="View VINs">${fmt(g.vins)}</button></td>
          <td class="num mono"><button class="lnk" data-a="vp" title="View processed VINs">${fmt(g.vp)}</button></td>
          <td class="num mono">${(g.pct * 100).toFixed(2)}%</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr>
          <td>Total (${fmt(list.length)})</td>${groupBy === 'team' ? '<td></td>' : ''}<td></td><td></td><td></td>

      </table></div>` : `<div class="state">No VINs match the current filters.</div>`}
    </section>`;

  document.querySelectorAll('.kpi.click').forEach(el => {
    const go = () => {
      const k = el.dataset.k;
      if (k === 'ent' || k === 'team'){
        if (groupBy !== k){ groupBy = k; render(); }
        $('breakdown').scrollIntoView({ behavior:'smooth', block:'start' });
      } else openDrill({ vpOnly: k === 'vp', qcOnly: k === 'qc' });
    };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  });
  document.querySelectorAll('.src-row').forEach(row => row.onclick = e => {
    const card = e.target.closest('.src-card'); if (!card) return;
    const key = row.dataset.dim, v = card.dataset.v;
    F[key] = (!v || (F[key] && F[key].size === 1 && F[key].has(v))) ? null : new Set([v]);
    changed();
  });
  const tbl = document.querySelector('#breakdown table');
  if (tbl) tbl.onclick = e => {
    const btn = e.target.closest('.lnk'); if (!btn) return;
    const tr = btn.closest('tr'), a = btn.dataset.a;
    const inBody = tr.dataset.g != null;
    const group = inBody ? { type:groupBy, g:+tr.dataset.g, name:btn.closest('tr').querySelector('[data-a="filter"]').textContent } : null;
    if (a === 'filter' || a === 'teams'){
      F[groupBy] = new Set([tr.dataset.id]);
      if (a === 'teams') groupBy = 'team';
      changed();
      window.scrollTo({ top:0, behavior:'smooth' });
    } else openDrill({ group, vpOnly: a === 'vp' });
  };
  $('groupSeg').onclick = e => { const g = e.target.dataset?.g; if (g && g !== groupBy){ groupBy = g; render(); } };
  document.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => {
    const c = th.dataset.s;
    if (sort.col === c) sort.dir = sort.dir === 'desc' ? 'asc' : 'desc';
    else { sort.col = c; sort.dir = ['name', 'ent', 'stage', 'seg', 'products'].includes(c) ? 'asc' : 'desc'; }
    render();
  });
}

// ─────────────────────────────────────────────────────────────
// REPORT VIEW
// ─────────────────────────────────────────────────────────────
// Per-rooftop counts of VIN units (U = VIN × rooftop), all / QC on / processed,
// under the current filters. A unit belongs to exactly one team, so enterprise
// totals are sums of their teams. `slice` (optional) narrows to one value of a
// dimension on top of the filters, e.g. { key:'reg', v:'AMER' }.
const inSlice = (slice, c) => !slice || String(D.cv[slice.key][c]).toLowerCase() === slice.v.toLowerCase();
function teamTotals(slice){
  const ok = comboOk(null), { any, lo, hi } = dayBounds();
  if (slice) for (let c = 0; c < D.nc; c++) if (!inSlice(slice, c)) ok[c] = 0;
  const { K, DAY, U, n, cTeam, cVp, cQc } = D, nt = D.teams.length;
  const all = new Int32Array(nt), qc = new Int32Array(nt), vp = new Int32Array(nt);
  let last = -1, lastQc = -1, lastVp = -1;
  for (let i = 0; i < n; i++){
    const c = K[i];
    if (!ok[c]) continue;
    if (!any){ const d = DAY[i]; if (d < 0 || d < lo || d > hi) continue; }
    const u = U[i], t = cTeam[c];
    if (u !== last){ all[t]++; last = u; }
    if (cQc[c] === 1 && u !== lastQc){ qc[t]++; lastQc = u; }
    if (cVp[c] === 1 && u !== lastVp){ vp[t]++; lastVp = u; }
  }
  return { all, qc, vp };
}

// Rows for the enterprise / rooftop lists: one per entity with at least one VIN.
function entityRows(level, T){
  const tEnt = D.teams.map(t => D.ents.findIndex(e => e.id === t[0]));
  if (level === 'team'){
    const out = [];
    D.teams.forEach((t, i) => { if (T.all[i]) out.push({ name:t[3] || t[2] || '(blank)', ent:t[1] || t[0], all:T.all[i], qc:T.qc[i], vp:T.vp[i] }); });
    return out;
  }
  const m = D.ents.map(e => ({ name:e.name, teams:0, all:0, qc:0, vp:0 }));
  D.teams.forEach((t, i) => { if (!T.all[i]) return; const e = m[tEnt[i]]; e.teams++; e.all += T.all[i]; e.qc += T.qc[i]; e.vp += T.vp[i]; });
  return m.filter(e => e.all);
}

// Fixed slices shown as their own report rows.
const REPORT_SLICES = {
  ent_seg: { key:'seg', v:'Ent',  title:'ENT customer segment report', label:'ENT' },
  amer:    { key:'reg', v:'AMER', title:'AMER region report',          label:'AMER' },
};

function renderReport(){
  const T = teamTotals();
  const sum = a => a.reduce((x, y) => x + y, 0), cnt = a => a.reduce((x, y) => x + (y > 0 ? 1 : 0), 0);
  const ents = entityRows('ent', T);
  const vin = { all:sum(T.all), qc:sum(T.qc), vp:sum(T.vp) };
  const ent = { all:ents.length, qc:ents.filter(e => e.qc).length, vp:ents.filter(e => e.vp).length };
  const team = { all:cnt(T.all), qc:cnt(T.qc), vp:cnt(T.vp) };
  const pct = (a, b) => b ? (a / b * 100).toFixed(2) + '%' : '0.00%';
  const card = (level, mode, label, val, tot, sub) => `
    <div class="kpi click ${mode === 'qc' ? 'qc' : mode === 'vp' ? 'accent' : ''}" data-level="${level}" data-mode="${mode}" role="button" tabindex="0">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${fmt(val)}</div>
      <div class="kpi-sub">${sub(pct(val, tot))}</div>
      <div class="kpi-bar" style="--kb:${mode === 'qc' ? 'var(--accent)' : mode === 'vp' ? 'var(--green)' : 'var(--ink-2)'}"><i style="width:${tot ? val / tot * 100 : 0}%"></i></div>
      <div class="kpi-hint">View list →</div>
    </div>`;
  const row = (title, note, cards) => `<section class="rep-row"><div class="rep-head"><h2>${title}</h2><span>${note}</span></div><div class="rep-cards">${cards}</div></section>`;

  // Slice rows: VIN counts inside the slice, with its enterprise / rooftop spread underneath.
  const sliceRow = id => {
    const sl = REPORT_SLICES[id], S = teamTotals(sl), E = entityRows('ent', S);
    const v = { all:sum(S.all), qc:sum(S.qc), vp:sum(S.vp) };
    const spread = m => `${fmt(E.filter(e => e[m]).length)} enterprises · ${fmt(cnt(S[m]))} rooftops`;
    return row(sl.title, `${esc(rangeLabel())} · ${esc(FILTERS.find(f => f.key === sl.key).label)} = ${esc(sl.label)} · VINs counted per rooftop`,
      card(id, 'all', `Total ${sl.label} VIN count`, v.all, v.all, () => `${spread('all')} · ${pct(v.all, vin.all)} of all VINs`) +
      card(id, 'qc', `QC on ${sl.label} VIN count`, v.qc, v.all, p => `${spread('qc')} · ${p} of ${sl.label} VINs`) +
      card(id, 'vp', `Video processed ${sl.label} VIN count`, v.vp, v.all, p => `${spread('vp')} · ${p} of ${sl.label} VINs`));
  };

  $('content').innerHTML =
    row('Enterprise level report', 'Enterprises with at least one matching VIN',
      card('ent', 'all', "Total VIN's enterprise count", ent.all, ent.all, () => `enterprises with any VIN`) +
      card('ent', 'qc', "QC on VIN's enterprise count", ent.qc, ent.all, p => `${p} of enterprises`) +
      card('ent', 'vp', "Video processed's enterprise count", ent.vp, ent.all, p => `${p} of enterprises`)) +
    row('Rooftop (team) level report', 'Rooftops with at least one matching VIN',
      card('team', 'all', "Total VIN's rooftop count", team.all, team.all, () => `rooftops with any VIN`) +
      card('team', 'qc', "QC on VIN's rooftop count", team.qc, team.all, p => `${p} of rooftops`) +
      card('team', 'vp', "Video processed's rooftop count", team.vp, team.all, p => `${p} of rooftops`)) +
    row('VIN level report', `${esc(rangeLabel())} · VINs counted per rooftop`,
      card('vin', 'all', 'Total VIN count', vin.all, vin.all, () => `${fmt(team.all)} rooftops · ${fmt(ent.all)} enterprises`) +
      card('vin', 'qc', 'QC on count', vin.qc, vin.all, p => `video_qualityCheck = 1 · ${p} of VINs`) +
      card('vin', 'vp', 'Video processed count', vin.vp, vin.all, p => `Video_Processed = 1 · ${p} of VINs`)) +
    sliceRow('ent_seg') +
    sliceRow('amer');

  document.querySelectorAll('.rep-row .kpi').forEach(el => {
    const go = () => {
      const { level, mode } = el.dataset;
      if (level === 'vin' || REPORT_SLICES[level]) openDrill({ qcOnly: mode === 'qc', vpOnly: mode === 'vp', slice: REPORT_SLICES[level] || null });
      else openEntityList(level, mode, T);
    };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  });
}

// Modal list of enterprises or rooftops (all / with QC-on VINs / with processed VINs).
function openEntityList(level, mode, T){
  const isTeam = level === 'team';
  const noun = isTeam ? 'Rooftops' : 'Enterprises';
  const title = noun + (mode === 'qc' ? ' with QC-on VINs' : mode === 'vp' ? ' with processed VINs' : ' with VINs');
  const recs = entityRows(level, T).filter(r => mode === 'all' || r[mode] > 0);
  const cols = [
    [isTeam ? 'Rooftop (team)' : 'Enterprise', r => r.name, 'text'],
    ...(isTeam ? [['Enterprise', r => r.ent, 'text']] : [['Rooftops', r => r.teams, 'num']]),
    ['VINs', r => r.all, 'num'], ['QC on', r => r.qc, 'num'], ['QC on %', r => r.all ? r.qc / r.all * 100 : 0, 'pct'],
    ['Processed', r => r.vp, 'num'], ['Processed %', r => r.all ? r.vp / r.all * 100 : 0, 'pct'],
  ];
  const sortCol = mode === 'qc' ? 3 : mode === 'vp' ? 5 : 2;
  const ds = { col: sortCol, dir:'desc' };
  const ov = modalShell(title, `${fmt(recs.length)} ${noun.toLowerCase()} · ${filterScope()}`, `Search ${noun.toLowerCase()}…`);
  let shown = recs;
  const cell = (c, r) => { const v = c[1](r); return c[2] === 'pct' ? v.toFixed(2) + '%' : c[2] === 'num' ? fmt(v) : esc(v); };
  const draw = () => {
    const q = ov.querySelector('#dmSearch').value.trim().toLowerCase();
    shown = q ? recs.filter(r => (r.name + ' ' + (r.ent || '')).toLowerCase().includes(q)) : recs.slice();
    const f = cols[ds.col][1], text = cols[ds.col][2] === 'text', dir = ds.dir === 'asc' ? 1 : -1;
    shown.sort((a, b) => dir * (text ? String(f(a)).localeCompare(String(f(b))) : f(a) - f(b)) || b.all - a.all);
    const arrow = i => ds.col === i ? `<span class="arr">${ds.dir === 'asc' ? '↑' : '↓'}</span>` : '';
    ov.querySelector('#dmBody').innerHTML = shown.length ? `<table>
      <thead><tr>${cols.map((c, i) => `<th data-c="${i}" class="${c[2] === 'text' ? '' : 'num'}">${c[0]}${arrow(i)}</th>`).join('')}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(c => `<td class="${c[2] === 'text' ? '' : 'num mono'}">${cell(c, r)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>` : '<div class="state">No rows match.</div>';
    ov.querySelectorAll('#dmBody th[data-c]').forEach(th => th.onclick = () => {
      const c = +th.dataset.c;
      if (ds.col === c) ds.dir = ds.dir === 'desc' ? 'asc' : 'desc';
      else { ds.col = c; ds.dir = cols[c][2] === 'text' ? 'asc' : 'desc'; }
      draw();
    });
    ov.querySelector('#dmFoot').textContent = `${fmt(shown.length)} ${noun.toLowerCase()}`;
  };
  const search = ov.querySelector('#dmSearch');
  search.disabled = false; search.focus();
  search.oninput = draw;
  const csvBtn = ov.querySelector('#dmCsv');
  csvBtn.disabled = false;
  csvBtn.onclick = () => downloadCsv(title, cols.map(c => c[0]), shown.map(r => cols.map(c => c[2] === 'pct' ? c[1](r).toFixed(2) : String(c[1](r)))));
  draw();
}

// ─────────────────────────────────────────────────────────────
// DRILL-DOWN (record list for a KPI or a table cell)
// ─────────────────────────────────────────────────────────────
let VINS = null;   // VIN strings, index = VIN id (vins.txt, loaded on first drill-down)
async function loadVins(){
  if (VINS && VINS.ver === D.lastSynced) return;
  const text = await (await fetch('vins.txt?t=' + encodeURIComponent(D.lastSynced), { cache:'no-store' })).text();
  const lines = text.split('\n');
  if (lines[0] !== D.lastSynced){
    // A newer deploy landed after data.json was loaded: reload both so VIN ids line up.
    await load();
    if (lines[0] !== D.lastSynced) throw new Error('VIN list is out of date. Refresh the page.');
  }
  VINS = lines.slice(1); VINS.ver = lines[0];
}

const DRILL_COLS = [
  ['VIN (sku_name)', r => r.vin], ['Enterprise', r => r.ent], ['Team', r => r.team],
  ['CRM status', r => r.crm], ['Source', r => r.src], ['Region', r => r.reg], ['Customer segment', r => r.seg], ['Video QC', r => r.vqc],
  ['Video processed', r => r.vp], ['Created on', r => r.day],
];
const PRODUCT_LABEL = { threeSixty:'360', image:'Image', video:'Video', advanceTools:'Advance tools', inventory:'Inventory', website:'Website' };
const prodLabel = p => PRODUCT_LABEL[p] || p;
const distinct = arr => [...new Set(arr.filter(Boolean))];
const dayStr = d => d < 0 ? '' : new Date(d * 864e5).toISOString().slice(0, 10);

function collectRows(group, vpOnly, qcOnly, slice){
  const ok = comboOk(null), { any, lo, hi } = dayBounds();
  const { K, DAY, n, cTeam, cEnt, cVp, cQc } = D, out = [];
  for (let i = 0; i < n; i++){
    const c = K[i];
    if (!ok[c]) continue;
    if (vpOnly && cVp[c] !== 1) continue;
    if (qcOnly && cQc[c] !== 1) continue;
    if (slice && !inSlice(slice, c)) continue;
    if (group && (group.type === 'team' ? cTeam[c] : cEnt[c]) !== group.g) continue;
    if (!any){ const d = DAY[i]; if (d < 0 || d < lo || d > hi) continue; }
    out.push(i);
  }
  out.sort((a, b) => DAY[b] - DAY[a] || D.VIN[a] - D.VIN[b]);
  return out;
}

function rowRec(i){
  const c = D.K[i], t = D.teams[D.cTeam[c]];
  return { vin: VINS[D.VIN[i]], ent: t[1] || t[0], team: t[3] || t[2], crm: D.cv.crm[c], src: D.cv.src[c], reg: D.cv.reg[c], seg: D.cv.seg[c],
           vqc: vqcLabel(D.cv.vqc[c]), vp: D.cVp[c] === 1 ? 'Yes' : 'No', day: dayStr(D.DAY[i]) };
}

function filterScope(){
  return [rangeLabel(), ...FILTERS.filter(f => F[f.key]).map(f => `${f.label}: ${F[f.key].size === 1 ? labelFor(f.key, [...F[f.key]][0]) : F[f.key].size + ' selected'}`)].join(' · ');
}

function modalShell(title, sub, placeholder){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><div><h3>${esc(title)}</h3><div class="modal-sub" id="dmSub">${esc(sub)}</div></div>
      <button class="btn-icon" id="dmClose" aria-label="Close">✕</button></div>
    <div class="modal-tools">
      <input class="ms-search" id="dmSearch" placeholder="${esc(placeholder)}" disabled>
      <button class="btn-icon" id="dmCsv" disabled>Download CSV</button>
    </div>
    <div class="tbl-wrap" id="dmBody"><div class="state">Loading…</div></div>
    <div class="modal-foot" id="dmFoot"></div>
  </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  const close = () => { ov.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#dmClose').onclick = close;
  return ov;
}

function downloadCsv(title, header, rows){
  const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const csv = [header.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = `${title.replace(/[^\w]+/g, '_').replace(/^_|_$/g, '')}_${toISO(new Date())}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function openDrill({ group = null, vpOnly = false, qcOnly = false, slice = null }){
  const title = (slice ? slice.label + ' ' : '') + (vpOnly ? 'Processed VINs' : qcOnly ? 'QC-on VINs' : 'VINs') + (group ? ` · ${group.name}` : '');
  const ov = modalShell(title, 'Loading…', 'Search VIN, enterprise, team, status, source…');
  ov.querySelector('#dmBody').innerHTML = '<div class="state">Loading VIN list…</div>';

  try { await loadVins(); }
  catch (err){ ov.querySelector('#dmBody').innerHTML = `<div class="state err">Couldn't load VINs: ${esc(err.message)}</div>`; return; }

  const idx = collectRows(group, vpOnly, qcOnly, slice);
  const recs = idx.map(rowRec);
  const vinCount = new Set(idx.map(i => D.U[i])).size;
  ov.querySelector('#dmSub').textContent = `${fmt(vinCount)} VINs · ${fmt(recs.length)} rows · ${filterScope()}`;

  const LIMIT = 500;
  // Same behaviour as the breakdown table: click a header to sort, click again to flip.
  // Default is newest first (Created on ↓); ties fall back to VIN ascending.
  const ds = { col: DRILL_COLS.length - 1, dir: 'desc' };
  const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
  let shown = recs;
  const draw = () => {
    const q = ov.querySelector('#dmSearch').value.trim().toLowerCase();
    shown = q ? recs.filter(r => DRILL_COLS.some(([, f]) => String(f(r)).toLowerCase().includes(q))) : recs.slice();
    const f = DRILL_COLS[ds.col][1], dir = ds.dir === 'asc' ? 1 : -1;
    shown.sort((a, b) => dir * cmp(String(f(a)).toLowerCase(), String(f(b)).toLowerCase()) || cmp(a.vin, b.vin));
    const arrow = i => ds.col === i ? `<span class="arr">${ds.dir === 'asc' ? '↑' : '↓'}</span>` : '';
    ov.querySelector('#dmBody').innerHTML = shown.length ? `<table>
      <thead><tr>${DRILL_COLS.map(([h], i) => `<th data-c="${i}">${h}${arrow(i)}</th>`).join('')}</tr></thead>
      <tbody>${shown.slice(0, LIMIT).map(r => `<tr>
        <td class="mono">${esc(r.vin)}</td><td>${esc(r.ent)}</td><td>${esc(r.team)}</td>
        <td>${esc(r.crm)}</td><td>${esc(r.src)}</td><td>${esc(r.reg)}</td><td>${esc(r.seg)}</td><td>${esc(r.vqc)}</td>
        <td><span class="pill ${r.vp === 'Yes' ? 'yes' : ''}">${r.vp}</span></td><td class="mono">${r.day}</td>
      </tr>`).join('')}</tbody></table>` : '<div class="state">No rows match.</div>';
    ov.querySelectorAll('#dmBody th[data-c]').forEach(th => th.onclick = () => {
      const c = +th.dataset.c;
      if (ds.col === c) ds.dir = ds.dir === 'desc' ? 'asc' : 'desc';
      else { ds.col = c; ds.dir = c === DRILL_COLS.length - 1 ? 'desc' : 'asc'; }
      draw();
    });
    ov.querySelector('#dmFoot').textContent = shown.length > LIMIT
      ? `Showing the first ${fmt(LIMIT)} of ${fmt(shown.length)} rows in this order. Use search, or download the CSV for all of them.`
      : `${fmt(shown.length)} row${shown.length === 1 ? '' : 's'}`;
  };
  let timer;
  const search = ov.querySelector('#dmSearch');
  search.disabled = false; search.focus();
  search.oninput = () => { clearTimeout(timer); timer = setTimeout(draw, 150); };
  const csvBtn = ov.querySelector('#dmCsv');
  csvBtn.disabled = false;
  csvBtn.onclick = () => downloadCsv(title, DRILL_COLS.map(([h]) => h), shown.map(r => DRILL_COLS.map(([, f]) => String(f(r)))));
  draw();
}

// ─────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────
async function load(){
  $('syncBtn').disabled = true;
  $('syncInfo').textContent = 'Syncing…';
  try {
    // data.json is rebuilt from Metabase by the GitHub Action (.github/workflows/deploy.yml).
    const resp = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    if (!resp.ok) throw new Error(`data.json not found (${resp.status}). Check that the "Deploy dashboard" GitHub Action has run.`);
    D = decode(await resp.json()); for (const k in DIM_COLOR) delete DIM_COLOR[k];
    showAge();
    syncTriggers();
    render();
  } catch (err){
    $('syncInfo').textContent = 'Sync failed';
    if (!D) $('content').innerHTML = `<div class="state err">Couldn't load data: ${esc(err.message)}</div>`;
  } finally {
    $('syncBtn').disabled = false;
  }
}

// Header text: when the published data was pulled from Metabase and how long ago.
// Turns amber after 30 minutes so a delayed GitHub schedule is obvious.
function showAge(){
  if (!D) return;
  const t = new Date(D.lastSynced), mins = Math.max(0, Math.round((Date.now() - t) / 60000));
  const ago = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.floor(mins / 60)} h ${mins % 60} min ago`;
  const el = $('syncInfo');
  el.textContent = `Updated ${t.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })} · ${ago} · ${fmt(D.n)} rows`;
  el.classList.toggle('stale', mins > 30);
  el.title = `Data pulled from Metabase at ${t.toLocaleString()}`;
}

  try { const t = localStorage.getItem('vvs_theme'); if (t) document.documentElement.dataset.theme = t; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch(e){}

    try { localStorage.setItem('vvs_theme', t); } catch(e){}
  };
  buildDateUI();

  document.addEventListener('click', closePanels);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanels(); });

  $('syncBtn').onclick = () => load();
  const setView = v => { VIEW = v; if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v); render(); window.scrollTo({ top:0 }); };
  $('viewSeg').onclick = e => { const v = e.target.closest('button')?.dataset.view; if (v && v !== VIEW) setView(v); };
  window.addEventListener('hashchange', () => { const v = location.hash === '#report' ? 'report' : 'summary'; if (v !== VIEW){ VIEW = v; render(); } });
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === VIEW));
  load();
  setInterval(load, 5 * 60 * 1000);
  setInterval(showAge, 60 * 1000);
})();
</script>
</body>
</html>
